services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./deploy/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./deploy/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      FRONTEND_ORIGIN: ${PUBLIC_SITE_URL}
      PUBLIC_URL: ${PUBLIC_SITE_URL}
      IS_PROXIED: "true"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      STRAPI_URL: http://backend:1337
      NUXT_PUBLIC_STRAPI_URL: ${PUBLIC_SITE_URL}
    depends_on:
      - backend

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: ./deploy/.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
